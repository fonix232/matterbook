# Runs only in the split-out repository (see ../../SPLIT.md).
#
# Publishes the archive HACS installs. The zip holds the *contents* of
# custom_components/matterbook at its root, because HACS extracts it straight
# into <config>/custom_components/matterbook/.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the manifest agrees with the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          manifest=$(python3 -c "import json;print(json.load(open('custom_components/matterbook/manifest.json'))['version'])")
          if [ "$manifest" != "$version" ]; then
            echo "::error::manifest.json says $manifest but the tag says $version."
            echo "::error::HACS reads the tag, Home Assistant reads the manifest; they must match."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: panel/package-lock.json

      - name: Build the panel
        working-directory: panel
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Package the integration
        run: |
          cd custom_components/matterbook
          find . -name '__pycache__' -type d -prune -exec rm -rf {} +
          zip -r "${{ runner.temp }}/matterbook.zip" . -x '*.DS_Store'
          unzip -l "${{ runner.temp }}/matterbook.zip" | grep -qE ' manifest\.json$' \
            || { echo "::error::manifest.json is not at the archive root"; exit 1; }

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag can arrive two ways: pushed from a clone, which fires this
          # workflow with no release yet, or created by "Draft a new release" in
          # the UI, which publishes the release first. Handle both, or the
          # second case fails with "release already exists" and ships no archive.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME exists; attaching the archive to it."
            gh release upload "$GITHUB_REF_NAME" \
              "${{ runner.temp }}/matterbook.zip#matterbook.zip" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              "${{ runner.temp }}/matterbook.zip#matterbook.zip"
          fi

      - name: Confirm the archive is attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # HACS downloads this asset by name; a release without it installs
          # nothing, and the workflow would otherwise have exited green.
          gh release view "$GITHUB_REF_NAME" --json assets \
            --jq '.assets[].name' | grep -qx 'matterbook.zip'
